[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-multisensor-alignment"
version = "0.2.0"
description = "Offline alignment for unified VisionTactile ROS 2 bags"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
vt-multisensor-align = "vt_multisensor_alignment.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
