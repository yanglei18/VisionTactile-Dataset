[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-glove-hand-pose"
version = "0.1.0"
description = "Experimental standalone twelve-IMU glove calibration and hand-pose viewer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26,<3", "pyserial>=3.5,<4", "vqf>=2.0,<3", "PyQt5>=5.15,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
vt-glove-pose = "vt_glove_pose.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vt_glove_pose = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
