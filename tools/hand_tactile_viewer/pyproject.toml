[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-hand-tactile-viewer"
version = "0.2.4"
description = "Standalone hand motion and tactile surface viewer"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = ["vt-capture-console>=0.8.0", "vt-fsglove12>=0.1.3", "vt-tactile-capture>=0.3.0"]

[project.scripts]
vt-right-hand-display = "vt_hand_tactile_viewer.app:main"
vt-left-hand-display = "vt_hand_tactile_viewer.app:left_main"
vt-hand-tactile = "vt_hand_tactile_viewer.app:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
