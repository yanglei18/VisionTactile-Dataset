[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-hand-tactile-viewer"
version = "0.1.0"
description = "Standalone hand motion and tactile surface viewer"
requires-python = ">=3.12"
dependencies = ["vt-capture-console>=0.6.5", "vt-fsglove12>=0.1.1", "vt-tactile-capture>=0.2.3"]

[project.scripts]
vt-hand-tactile = "vt_hand_tactile_viewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
