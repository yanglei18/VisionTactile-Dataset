[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vt-tracker-camera-calibration"
version = "0.1.0"
description = "Offline HTC VIVE Ultimate Tracker to RealSense hand-eye calibration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "vt-capture-core>=0.5.0",
  "numpy>=1.26,<2",
  "opencv-contrib-python-headless>=4.9,<4.12",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
vt-tracker-camera-calibrate = "vt_tracker_camera_calib.cli:entrypoint"
vt-tracker-camera-calibrate-gui = "vt_tracker_camera_calib.gui:entrypoint"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
