name: Capture console

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-console:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/capture_console/requirements-tested.txt
            tools/capture_console/pyproject.toml
            tools/hand_tactile_viewer/pyproject.toml
            tools/fsglove12/pyproject.toml
            tools/tracker_deploy/pyproject.toml
            tools/multisensor_alignment/pyproject.toml
            ros2_ws/src/vt_capture_core/setup.py
            ros2_ws/src/vt_capture_manager/setup.py
            ros2_ws/src/vt_tactile_capture/setup.py
      - name: Install runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 fonts-noto-cjk python3-tk xvfb xauth
      - name: Install isolated packages
        run: >-
          python -m pip install -r tools/capture_console/requirements-tested.txt
          -e ros2_ws/src/vt_capture_core -e ros2_ws/src/vt_tactile_capture -e 'tools/fsglove12[functional]' -e tools/capture_console
          -e tools/hand_tactile_viewer
          -e ros2_ws/src/vt_capture_manager -e tools/multisensor_alignment
          -e tools/tracker_deploy
          'opencv-python-headless>=4.9,<4.12'
      - name: Check installed package dependencies and CLI entry points
        run: |
          python -m pip check
          vt-capture-console --help
          vt-multisensor-align --help
          vt-tracker-deploy --help
          vt-hand-tactile --help
      - name: Test shared core, managed capture workflow and GUI
        env:
          # Exercise the real pure-Python controller/manager boundary as well
          # as fake adapters. This CMake package is built separately by ROS CI.
          PYTHONPATH: ros2_ws/src/vt_realsense_capture:tools/capture_deploy
        run: >-
          xvfb-run -a python -m pytest -q ros2_ws/src/vt_capture_core/test
          ros2_ws/src/vt_capture_manager/test tools/capture_console/tests
          tools/capture_deploy/tests tools/tracker_deploy/tests
      - name: Test shared hand renderer and dual-hand isolation without model assets
        # Synthetic geometry and fake acquisition only; licensed MANO models
        # and the separately deployed FSGlove/PyVUT runtime are not required.
        run: >-
          python -m pytest -q
          tools/fsglove12/tests/test_hand_isolation.py
          tools/fsglove12/tests/test_pose_export.py
          tools/fsglove12/tests/test_hand_view.py
          tools/fsglove12/tests/test_tactile_preview_export.py
      - name: Test standalone hand and tactile viewer without devices or model assets
        # Fake readers and synthetic geometry cover lifecycle, protocol
        # identification, display composition, settings and packaging. QMT's
        # public numeric self-check runs without Torch or licensed MANO assets.
        run: python -m pytest -q tools/hand_tactile_viewer/tests
      - name: Smoke test demo at laptop resolution
        run: python -m vt_capture_console --demo --size 1366x768 --smoke-seconds 2 --screenshot /tmp/capture-console.png
      - uses: actions/upload-artifact@v4
        with:
          name: capture-console-preview
          path: /tmp/capture-console.png
