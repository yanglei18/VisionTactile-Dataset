name: Glove calibration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyqt-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PyQt5
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/fsglove12/requirements-tested.txt
            tools/fsglove12/requirements-live-tested.txt
            tools/fsglove12/pyproject.toml
            ros2_ws/src/vt_tactile_capture/setup.py
      - name: Install headless Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 fonts-noto-cjk
      - name: Install calibration and pure tactile transport
        # Keep PyQt5 isolated from the main application's PySide6 job.
        # No licensed model, upstream checkout, ROS runtime or device is needed.
        run: >-
          python -m pip install
          -r tools/fsglove12/requirements-tested.txt
          -r tools/fsglove12/requirements-live-tested.txt
          -e 'tools/fsglove12[test,live]'
          -e ros2_ws/src/vt_tactile_capture
      - name: Require GUI dependencies and installed entry point
        run: |
          python -m pip check
          python - <<'PY'
          from PyQt5 import QtCore, QtGui, QtWidgets
          import OpenGL.GL
          import pyqtgraph.opengl
          import serial
          from pyqtgraph.Qt import QT_LIB
          from vt_tactile_capture import display_transport
          assert QT_LIB == "PyQt5", QT_LIB
          app = QtWidgets.QApplication([])
          assert app.platformName() == "offscreen"
          PY
          vt-fsglove12 --help
      - name: Test calibration, runtime and UI with synthetic inputs
        run: >-
          python -m pytest tools/fsglove12/tests -q -ra
          --junitxml=artifacts/ci/glove-calibration.xml
      - name: Require execution of critical calibration regressions
        if: always()
        run: python tools/fsglove12/scripts/verify_ci_results.py artifacts/ci/glove-calibration.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glove-calibration-tests
          path: artifacts/ci/glove-calibration.xml
          if-no-files-found: warn
