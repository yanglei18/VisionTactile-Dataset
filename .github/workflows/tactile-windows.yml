name: Standalone tactile viewer on Windows

on:
  push:
    paths:
      - .github/workflows/tactile-windows.yml
      - tools/tactile_viewer_windows/**
      - tools/capture_console/**
      - tools/fsglove12/**
      - ros2_ws/src/vt_capture_core/**
      - ros2_ws/src/vt_tactile_capture/**
  pull_request:
    paths:
      - .github/workflows/tactile-windows.yml
      - tools/tactile_viewer_windows/**
      - tools/capture_console/**
      - tools/fsglove12/**
      - ros2_ws/src/vt_capture_core/**
      - ros2_ws/src/vt_tactile_capture/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PySide6
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: tools/tactile_viewer_windows/requirements-build.lock
      - name: Install pinned runtime and local packages
        run: |
          python -m pip install --only-binary=:all: -r tools/tactile_viewer_windows/requirements-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation ./ros2_ws/src/vt_capture_core ./ros2_ws/src/vt_tactile_capture ./tools/fsglove12 ./tools/capture_console
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "pytest==8.3.5"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m vt_capture_console.tactile_app --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native COM compatibility and shared data pipeline
        # Only fake serial devices are opened. Linux /proc and PTY tests have
        # platform guards; the Windows COM simulation tests must still run.
        run: >-
          python -m pytest -q
          ros2_ws/src/vt_tactile_capture/test/test_host_clock.py
          ros2_ws/src/vt_tactile_capture/test/test_serial_source.py
          ros2_ws/src/vt_tactile_capture/test/test_protocol.py
          ros2_ws/src/vt_tactile_capture/test/test_assembler.py
      - name: Isolate standalone preview tests from workstation fixtures
        # capture_console/tests/conftest.py imports the Linux workstation.
        # Copy the unchanged standalone tests, supplying only their Qt fixture.
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'tactile-standalone-tests'
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          foreach ($name in @('test_tactile_serial.py', 'test_tactile_source.py', 'test_tactile_window.py', 'test_tactile_model_loader.py', 'test_tactile_installation.py', 'test_tactile_i18n.py', 'test_tactile_diagnostics_i18n.py')) {
            Copy-Item (Join-Path 'tools/capture_console/tests' $name) (Join-Path $testRoot $name)
          }
          @'
          import pytest
          from PySide6.QtWidgets import QApplication

          @pytest.fixture(scope="session")
          def qapp():
              app = QApplication.instance() or QApplication([])
              yield app
          '@ | Set-Content -Encoding utf8 (Join-Path $testRoot 'conftest.py')
          python -m pytest -q --confcutdir $testRoot $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaging tools and installed runtime resources
        # Synthetic geometry only: no MANO download, installer build, signing,
        # release, or artifact upload is performed by this workflow.
        run: python -m pytest -q tools/tactile_viewer_windows/tests
