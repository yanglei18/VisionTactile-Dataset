name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/tracker_camera_calibration/pyproject.toml
            tools/multisensor_alignment/pyproject.toml
      - name: Install offline tools
        run: >-
          python -m pip install -e 'tools/tracker_camera_calibration[test]'
          -e 'tools/multisensor_alignment[test]'
          -e ros2_ws/src/vt_capture_core -e ros2_ws/src/vt_capture_manager
          'cryptography>=41'
      - name: Install offline GUI test libraries
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth
      - name: Check offline package dependencies and installed entry points
        run: |
          python -m pip check
          vt-tracker-camera-calibrate --help
          vt-tracker-camera-calibrate-gui --help
          vt-multisensor-align --help
      - name: Test public tree checker
        run: python3 tools/test_check_public_tree.py
      - name: Test source-only release preparation without touching the working index
        run: python3 -m unittest discover -s tools/release/tests -v
      - name: Test VIVE tracker validator
        run: PYTHONPATH=tools/vut_validation/src python3 -m unittest discover -s tools/vut_validation/tests -v
      - name: Test offline Tracker-camera calibration
        # pytest also collects the function/fixture-based offline GUI tests;
        # unittest discover silently omitted them. All inputs are synthetic.
        run: xvfb-run -a python -m pytest tools/tracker_camera_calibration/tests -q
      - name: Test offline multisensor alignment
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=tools/multisensor_alignment/src python3 -m pytest tools/multisensor_alignment/tests -q
      - name: Install tactile core test dependencies
        run: python -m pip install pytest pyserial
      - name: Test tactile parser, legacy parity, and bounded serial core without ROS
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ros2_ws/src/vt_tactile_capture
        run: >-
          python -m pytest -q
          ros2_ws/src/vt_tactile_capture/test/test_protocol.py
          ros2_ws/src/vt_tactile_capture/test/test_grid.py
          ros2_ws/src/vt_tactile_capture/test/test_assembler.py
          ros2_ws/src/vt_tactile_capture/test/test_serial_source.py
          ros2_ws/src/vt_tactile_capture/test/test_host_clock.py
          ros2_ws/src/vt_tactile_capture/test/test_legacy_parity.py
          ros2_ws/src/vt_tactile_capture/test/test_display_transport.py
      - name: Test tactile surface binding and display controller without model assets
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: tools/fsglove12/src:ros2_ws/src/vt_tactile_capture
        run: >-
          python -m pytest -q
          tools/fsglove12/tests/test_tactile_surface.py
          tools/fsglove12/tests/test_tactile_overlay.py
      - name: Validate public tree
        run: python3 tools/check_public_tree.py
      - name: Check whitespace
        run: |
          EMPTY_TREE="$(git hash-object -w -t tree /dev/null)"
          git diff --check "$EMPTY_TREE" HEAD

  glove-hand-pose:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/glove_hand_pose/pyproject.toml
      - name: Install standalone glove tool
        run: python -m pip install -e 'tools/glove_hand_pose[test]'
      - name: Install headless Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Check standalone package dependencies
        run: python -m pip check
      - name: Test glove parsing, calibration, model, and GUI
        run: python -m pytest tools/glove_hand_pose/tests -q
      - name: Run synthetic demo without hardware
        run: |
          vt-glove-pose demo --headless --seconds 1
          vt-glove-pose demo --smoke-seconds 1

  ros2-jazzy:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # Synthetic messages, fake Recorder and private loopback domains only;
      # no physical glove, camera, Tracker or serial device is opened.
      ROS_LOCALHOST_ONLY: "1"
      VT_CAPTURE_MANAGER_ROS_TEST: "1"
      VT_GLOVE_ROS_INTEGRATION: "1"
    steps:
      - name: Check out standalone tools used by ROS integration tests
        uses: actions/checkout@v6
      - name: Build and test ROS 2 packages
        uses: ros-tooling/action-ros-ci@v0.4
        env:
          # ROS packages remain installed by colcon; expose only the separate
          # alignment tool also provided by the application launcher.
          PYTHONPATH: ${{ github.workspace }}/tools/multisensor_alignment/src
        with:
          import-token: ${{ secrets.GITHUB_TOKEN }}
          package-name: vt_camera_msgs vt_realsense_capture vt_tracker_msgs vt_vive_tracker vt_vive_tracker_gui vt_tactile_msgs vt_tactile_capture vt_glove_msgs vt_glove_bridge vt_capture_core vt_capture_manager
          target-ros2-distro: jazzy
          no-symlink-install: true
          coverage-result: false
