name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/tracker_camera_calibration/pyproject.toml
            tools/multisensor_alignment/pyproject.toml
      - name: Install offline tools
        run: >-
          python -m pip install -e tools/tracker_camera_calibration
          -e "tools/multisensor_alignment[test]"
      - name: Test public tree checker
        run: python3 tools/test_check_public_tree.py
      - name: Test VIVE tracker validator
        run: PYTHONPATH=tools/vut_validation/src python3 -m unittest discover -s tools/vut_validation/tests -v
      - name: Test offline Tracker-camera calibration
        run: PYTHONPATH=tools/tracker_camera_calibration/src python3 -m unittest discover -s tools/tracker_camera_calibration/tests -v
      - name: Test offline multisensor alignment
        run: PYTHONPATH=tools/multisensor_alignment/src python3 -m unittest discover -s tools/multisensor_alignment/tests -v
      - name: Validate public tree
        run: python3 tools/check_public_tree.py
      - name: Validate pinned PyVUT tree
        run: python3 third_party/pyvut/tools/check_public_tree.py
      - name: Check whitespace
        run: |
          EMPTY_TREE="$(git hash-object -w -t tree /dev/null)"
          git diff --check "$EMPTY_TREE" HEAD

  ros2-jazzy:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Build and test ROS 2 packages
        id: ros_ci
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          import-token: ${{ secrets.GITHUB_TOKEN }}
          package-name: vt_camera_msgs vt_realsense_capture vt_tracker_msgs vt_vive_tracker vt_vive_tracker_gui
          target-ros2-distro: jazzy
          no-symlink-install: true
          coverage-result: false
      - name: Test real MCAP alignment reads in the ROS workspace
        shell: bash
        env:
          ROS_WORKSPACE: ${{ steps.ros_ci.outputs.ros-workspace-directory-name }}
        run: |
          source /opt/ros/jazzy/setup.bash
          source "${ROS_WORKSPACE}/install/setup.bash"
          PYPROJECT="$(find "${ROS_WORKSPACE}/src" -path '*/tools/multisensor_alignment/pyproject.toml' -print -quit)"
          test -n "${PYPROJECT}"
          REPOSITORY_ROOT="$(dirname "$(dirname "$(dirname "${PYPROJECT}")")")"
          PYTHONPATH="${REPOSITORY_ROOT}/tools/multisensor_alignment/src:${PYTHONPATH}" \
            python3 -m unittest discover \
              -s "${REPOSITORY_ROOT}/tools/multisensor_alignment/tests" \
              -p 'test_*synthetic_mcap.py' -v
