name: Installed distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist-wheel-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/release/constraints-tested.txt
      - name: Install headless GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 fonts-noto-cjk
      - name: Build source distributions and install rebuilt wheels outside the checkout
        # Fresh PySide6 and PyQt5 environments, synthetic demos only. No ROS
        # nodes, physical hardware, licensed MANO assets or private extensions.
        run: python tools/release/verify_distributions.py --profile all --output .runtime/distributions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-distribution-validation
          path: .runtime/distributions
