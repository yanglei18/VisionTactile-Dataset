# Formal hand capture example: raw IMU + solved pose + tactile for BOTH hands.
# Preserves the existing three-camera/three-Tracker profile. Camera serials must
# match the workstation. To select one hand, remove all three streams of the
# other hand and their QoS entries. Remove the corresponding entries for
# pose-only or tactile-only capture.
# This example does not overwrite an existing workstation configuration.
cameras:
  - name: d405_1
    model_token: D405
    serial: "260322278433"
    firmware: "5.15.1.55"
    asic_serial: "255323071625"
    color_module: depth_module
  - name: d405_2
    model_token: D405
    serial: "260322276463"
    firmware: "5.15.1.55"
    asic_serial: "255323071742"
    color_module: depth_module
  - name: d436
    model_token: D436
    serial: "408322071716"
    firmware: "5.17.0.213"
    asic_serial: "343123151280"
    color_module: rgb_camera
stream:
  width: 1280
  height: 720
  fps: 30
  color_format: RGB8
  color_encoding: rgb8
  depth_format: Z16
  depth_encoding: 16UC1
recording:
  max_bag_duration_seconds: 300
  max_bag_size_bytes: 137438953472
  max_cache_size_bytes: 1073741824
  additional_streams:
    - topic: /gloves/left/imu/raw
      type: vt_glove_msgs/msg/RawImuBatch
    - topic: /gloves/left/state
      type: vt_glove_msgs/msg/GloveState
    - topic: /gloves/left/tactile/samples
      type: vt_tactile_msgs/msg/TactileRow44Array
    - topic: /gloves/right/imu/raw
      type: vt_glove_msgs/msg/RawImuBatch
    - topic: /gloves/right/state
      type: vt_glove_msgs/msg/GloveState
    - topic: /gloves/right/tactile/samples
      type: vt_tactile_msgs/msg/TactileRow44Array
  # Match the reliable publishers of the integrated hand services.
  qos_overrides:
    /gloves/left/imu/raw: {reliability: reliable}
    /gloves/left/state: {reliability: reliable}
    /gloves/left/tactile/samples: {reliability: reliable}
    /gloves/right/imu/raw: {reliability: reliable}
    /gloves/right/state: {reliability: reliable}
    /gloves/right/tactile/samples: {reliability: reliable}
